[package]
name = "callpc-executor"
version = "0.1.0"
edition = "2021"
description = "callpc executor — dumb I/O stub for the controlled computer (docs/PROTOCOL.md)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "=0.3.31"           # 0.3.32 wants a nonexistent futures-io 0.3.32
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
dirs = "5"
gethostname = "0.5"
# default feature is "xdo" (needs system libxdo); use pure-Rust x11rb + native
# wayland/libei instead. These are Linux-only enigo features — inert on
# Windows (SendInput) and macOS (CGEvent), which build unconditionally.
enigo = { version = "0.2", default-features = false, features = ["x11rb", "wayland", "libei"] }
xcap = "0.3"                       # screenshots: DXGI / CoreGraphics / X11 / Wayland
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
