[package]
name = "callpc-executor"
version = "0.1.0"
edition = "2021"
description = "callpc executor — dumb I/O stub for the controlled computer (docs/PROTOCOL.md)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
dirs = "5"
gethostname = "0.5"
enigo = "0.2"                      # input: SendInput / CGEvent / x11rb-uinput
xcap = "0.3"                       # screenshots: DXGI / CoreGraphics / X11 / Wayland
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
