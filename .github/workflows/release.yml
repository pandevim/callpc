name: build-executor

# Cross-compile the callpc-executor for Windows / macOS / Linux and attach the
# binaries to a GitHub Release. Asset names match webapp/connect.html's download
# links (callpc-executor-{linux-x64,macos-universal,windows-x64.exe}).
#
# Triggers: push a tag like `v0.1.0`, or run manually (workflow_dispatch) to get
# the binaries as workflow artifacts without cutting a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: executor

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: callpc-executor-linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: callpc-executor-windows-x64.exe
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            asset: callpc-executor-macos-universal
            target: universal-apple-darwin   # handled specially below
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Linux native deps for enigo (wayland/xkb) + xcap/ashpd (dbus). x11rb,
      # input-linux, and zbus are pure-Rust and need nothing.
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev pkg-config
        working-directory: .

      - name: Build (Linux / Windows)
        if: matrix.os != 'macos-latest'
        run: cargo build --release

      # macOS: build both arches and lipo into one universal binary.
      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output callpc-executor-universal \
            target/x86_64-apple-darwin/release/callpc-executor \
            target/aarch64-apple-darwin/release/callpc-executor

      - name: Stage asset
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/callpc-executor.exe "${{ matrix.asset }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp callpc-executor-universal "${{ matrix.asset }}"
          else
            cp target/release/callpc-executor "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: executor/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: executor/${{ matrix.asset }}
