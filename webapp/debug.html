<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>callpc — task debug</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #0b0f1a; color: #eef1f7; padding: 24px; }
    h1 { font-size: 1.2rem; margin-bottom: 14px; }
    .bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    input[type=text] { flex: 1; min-width: 280px; padding: 10px 14px; border-radius: 8px;
      border: 1px solid #344; background: #161c2e; color: #eef1f7; font-size: 1rem; }
    button { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
      background: #1faf5b; color: #fff; font-size: 1rem; font-weight: 600; }
    button.red { background: #d83a30; }
    button.gray { background: #3a4565; }
    #status { margin: 8px 0 16px; color: #93a0b8; }
    #status .running { color: #6ee7a0; }
    #status .failed { color: #f4655a; }
    .step { display: flex; gap: 16px; background: #121829; border: 1px solid #232c44;
      border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .step img { width: 380px; max-width: 38vw; border-radius: 6px; border: 1px solid #232c44; }
    .step .txt { flex: 1; font-size: .92rem; }
    .step .n { color: #6ee7a0; font-weight: 700; margin-bottom: 6px; }
    .step .thought { color: #aeb8d0; white-space: pre-wrap; margin-bottom: 8px; }
    .step .action { font-family: ui-monospace, monospace; color: #ffd479; white-space: pre-wrap; }
    .step .result { margin-top: 6px; color: #93a0b8; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>callpc — task runner debug</h1>
  <div class="bar">
    <input id="instruction" type="text" placeholder='e.g. Click the center of grid cell C4'
           value="">
    <button id="run">Run task</button>
    <button id="cancel" class="red">Cancel</button>
    <button id="calib" class="gray">Calibrate (grid)</button>
  </div>
  <div id="status">idle</div>
  <div id="steps"></div>

<script>
const $ = id => document.getElementById(id);
// passcode (shared with the call/connect pages); prompt once if the gateway needs it
function codeHeaders(json) {
  const h = json ? { "Content-Type": "application/json" } : {};
  const c = (localStorage.getItem("callpc_code") || "").trim();
  if (c) h["X-Callpc-Code"] = c;
  return h;
}
const api = (p, opt) => fetch(p, opt).then(async r => {
  if (r.status === 401) {
    const c = prompt("Passcode:");
    if (c) { localStorage.setItem("callpc_code", c.trim()); }
  }
  return r.json();
});

let timer = null;
let lastRendered = "";

function render(st) {
  // a step's screenshot never changes once taken — only re-render (and only
  // re-fetch images) when the status payload actually changed, else the page
  // jitters every poll
  const key = JSON.stringify([st.state, st.detail, (st.steps || []).length,
                              (st.steps || []).map(s => s.result)]);
  if (key === lastRendered) return;
  lastRendered = key;
  const cls = st.state === "running" ? "running" : (st.state === "failed" ? "failed" : "");
  $("status").innerHTML =
    `<span class="${cls}">${st.state}</span>` +
    (st.instruction ? ` — “${st.instruction}”` : "") +
    (st.detail ? ` — ${st.detail}` : "");
  const box = $("steps");
  box.innerHTML = "";
  (st.steps || []).slice().reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "step";
    div.innerHTML = `
      <a href="/api/task/screenshot/${s.n}" target="_blank">
        <img src="/api/task/screenshot/${s.n}" alt="step ${s.n}"></a>
      <div class="txt">
        <div class="n">step ${s.n}</div>
        <div class="thought">${(s.thought || "").replace(/</g, "&lt;")}</div>
        <div class="action">${(s.action_text || "").replace(/</g, "&lt;")}</div>
        <div class="result">${s.dispatched || ""} ${s.result || ""}</div>
      </div>`;
    box.appendChild(div);
  });
}

async function poll() {
  try { render(await api("/api/task")); } catch (e) { $("status").textContent = "gateway unreachable"; }
}

$("run").onclick = async () => {
  const instruction = $("instruction").value.trim();
  if (!instruction) return;
  const r = await api("/api/task", { method: "POST",
    headers: codeHeaders(true),
    body: JSON.stringify({ instruction }) });
  if (r.error) $("status").textContent = r.error;
};
$("cancel").onclick = () => api("/api/task", { method: "DELETE", headers: codeHeaders(false) });
$("calib").onclick = async () => {
  $("status").textContent = "calibrating (several model calls)...";
  const r = await api("/api/calibrate", { method: "POST",
    headers: codeHeaders(true), body: "{}" });
  $("status").textContent = "calibration: " + JSON.stringify(r);
};

timer = setInterval(poll, 1500);
poll();
</script>
</body>
</html>
